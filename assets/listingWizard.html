<script type="text/html" id="locationDetailsT">
    <h4>Find Location <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Choose a location by name, postal code or address'">?</a></h4>
    <input type="text" name="locationSearch" placeholder="Name, postal code or address" data-bind="
           autoComplete : { source: searchPostal, select: chooseLocation, change:chooseLocation, minLength: 2 },
           value:listing.page().name,
           event:{blur:noAutocomplete}">
    <!--ko template: { if:showSubType, afterRender:resize }-->
    <br><br>
    <h4>Location Type <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title: 'We do not recognise this location, please tell us which category it falls under.'">?</a></h4>
    <select data-bind="
            options: subTypes,
            value: subtype,
            optionsCaption: 'Choose a location type ...'"
            style='width:264px;margin-top:4px'></select>
    <!--/ko-->
    <!--ko template: { if: subtype, afterRender:resize }-->
    <br><br>
    <h4>Property Type <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title: propertyTypeCaption">?</a></h4>
    <select data-bind="
            options: propertyTypes,
            value: listing.property_type,
            optionsCaption: 'Choose a property type ...'"
            style='width:264px;margin-top:4px'></select>
    <br>
    <label class="checkbox" style="width:100%;font-size:1.1em;font-weight: normal">
        <input type="checkbox" data-bind="checked:showAddress">&nbsp;&nbsp;Show real address & map?
        <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'If unchecked, Address & maps will not be shown, we will put the listing in the correct location but you have to provide more details.'">?</a>
    </label>
    <!--/ko-->
    <button class="btn pull-right" data-bind="enable:listing.property_type,click:goNext">Next</button>
</script>
<script type="text/html" id="listingDetailsT">
    <div class="control-group" style="min-height:36px">
        <label class="control-label" for="rent">Type</label>
        <div class="controls">
            <label class="radio inline" style="font-size:13px;font-weight:normal;">
                <input type="radio" id="saleCheck" name="listing_type" value="Sale" data-bind="checked: listing.type" >&nbsp;&nbsp;Sale
            </label>
            <label class="radio inline" style="font-size:13px;font-weight:normal;">
                <input type="radio" id="rentCheck" name="listing_type" value="Rent" data-bind="checked: listing.type" >&nbsp;&nbsp;Rent
            </label>
        </div>
    </div>
    <!--ko template: { if:listing.type() === 'Rent', afterRender:resize}-->
    <div class="control-group" data-bind="validationElement: listing.leaseSpace">
        <label class="control-label" for="availability">Availability <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Please choose a date this listing becomes available for lease and the space available for rent'">?</a></label>
        <div class="controls">
            <input class="textUnit" readonly="readonly" id="availability" data-bind="datepicker: listing.availability, datepickerOptions : {changeMonth : true, changeYear : true, yearRange : '2013:2015', dateFormat: 'dd-M-y'}" type="text" placeholder="Click to Choose"> -
            <select data-bind="
                    options: leaseSpaceTypes,
                    value: listing.leaseSpace,
                    optionsCaption: 'Space Leased...'"
                    style='margin: 4px 0 3px 0;width:127px'></select>
            <span class="help-block" data-bind="validationMessage: listing.leaseSpace"></span>
        </div>
    </div>
    <!--/ko-->
    <div class="control-group" data-bind="validationElement: listing.unit.floor">
        <label class="control-label" for="listingFloor">Unit No. <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'We do not show the unit number but we need this for statistics'">?</a></label>
        <div class="controls">
            <input class="textUnit" type="text" name="listingFloor" placeholder="Floor" data-bind="
                   value:listing.unit.floor,
                   valueUpdate:'afterkeydown'"> -
            <input class="textUnit" type="text" name="listingStack" placeholder="Stack" data-bind="
                   value:listing.unit.stack,
                   valueUpdate:'afterkeydown'">
            <span class="help-inline" data-bind="if:listing.page().subtype === 'Private Landed'">
                <label class="checkbox" style="width:100%;font-weight: normal"><input type="checkbox" data-bind="title:'For landed properties, please click here.', checked:listing.unitIsAddress"><span class='muted'>&nbsp;&nbsp;Same as Address (Landed)</span></label>
            </span>
            <span class="help-block" data-bind="validationMessage: listing.unit.floor"></span>
            <span class="help-block" data-bind="validationMessage: listing.unit.stack"></span>
        </div>
    </div>
    <div class="control-group" data-bind="validationElement: listing.builtSize">
        <label class="control-label" for="listingBuilt">Built <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Size in square feet. Examples: \'5500\' or \'5.5k\'. Enter \'0\' if there is no size information.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingBuilt" placeholder="Built-Up Size (sqft)" data-bind="
                   value:listing.builtSize, valueUpdate:'afterkeydown'">
            <span class="help-inline">
                <label class="checkbox" style="width:100%;"><input type="checkbox" value="0" data-bind="checked:hasLand">&nbsp;&nbsp;Include land size?</label>
            </span>
            <span class="help-block" data-bind="validationMessage: listing.builtSize"></span>
        </div>
        <!--ko template: { if:hasLand, afterRender:resize }-->
        <br>
        <label class="control-label" for="listingLand">Land <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Size in square feet. Examples: \'5500\' or \'5.5k\'. Enter \'0\' if there is no size information.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingLand" placeholder="Land Size (sqft)" data-bind="
                   value:listing.landSize,
                   valueUpdate:'afterkeydown'">
            <span class="help-block" data-bind="validationMessage: listing.landSize"></span>
        </div>
        <!--/ko-->
    </div>
    <div class="control-group" data-bind="validationElement: listing.price">
        <label class="control-label" for="listingAsking">Price <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Enter an asking price Examples: \'1.2m\' or \'550k\'. Enter \'0\' if not available.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingAsking" placeholder="Price" data-bind="
                   value:listing.price, valueUpdate:'afterkeydown'">
            <span class="help-inline" data-bind="visible:listing.type() === 'Sale'">
                <label class="checkbox" style="width:100%;"><input type="checkbox" value="0" data-bind="checked:hasValuation">&nbsp;&nbsp;Valuation?</label>
            </span>
            <span class="help-block" data-bind="validationMessage: listing.price"></span>
        </div>
        <!--ko template: { if:hasValuation, afterRender:resize }-->
        <br>
        <label class="control-label" for="listingValue">Valuation <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'If this property has been valued, enter a valuation price. Examples: \'1.2m\' or \'550k\'.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingValue" placeholder="Valuation Price" data-bind="
                   value:listing.valuation, valueUpdate:'afterkeydown'">
            <span class="help-block" data-bind="validationMessage: listing.valuation"></span>
        </div>
        <br>
        <label class="control-label" for="listingCOV">COV <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Cash over Valuation. This field is auto calculated.'">?</a></label>
        <div class="controls">
            <input type="text" readonly="readonly" name="listingCOV" placeholder="Cash Over Valuation" data-bind="
                   value:listing.cov, valueUpdate:'afterkeydown'">
            <span class="help-block" data-bind="validationMessage: listing.cov"></span>
        </div>
        <!--/ko-->
    </div>
    <div class="control-group" data-bind="validationElement: listing.rooms">
        <label class="control-label" for="listingRooms">Rooms <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Enter the number of rooms this unit has.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingRooms" placeholder="No. of rooms" data-bind="
                   value:listing.rooms, valueUpdate:'afterkeydown'">
            <span class="help-block" data-bind="validationMessage: listing.rooms"></span>
        </div>
    </div>
    <div class="control-group" data-bind="validationElement: listing.baths">
        <label class="control-label" for="listingBaths">Bathrooms <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Enter the number of bathrooms this unit has.'">?</a></label>
        <div class="controls">
            <input type="text" name="listingBaths" placeholder="No. of bathrooms" data-bind="
                   value:listing.baths, valueUpdate:'afterkeydown'">
            <span class="help-block" data-bind="validationMessage: listing.baths"></span>
        </div>
    </div>
    <div class="control-group" data-bind="validationElement: listing.message">
        <label class="control-label" for="listingDescription">Description <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'The listing\'s description is seen by everyone. This box expands as you type.'">?</a></label>
        <div class="controls">
            <textarea class="span3" name="listingDescription" placeholder="Description is seen by everyone" data-bind="
                      value:listing.message,
                      valueUpdate:'afterkeydown',
                      expand:true"></textarea>
            <span class="help-block" data-bind="validationMessage: listing.message"></span>
        </div>
    </div>
    <div class="control-group" data-bind="validationElement: listing.cobroke">
        <label class="control-label" for="listingCoBrokeNotes">Co-Broke  <a href="#" class="label label-inverse help-text" tabindex="-1" data-bind="title:'Notes are seen by Realt Agents only. This box expands as you type.'">?</a></label>
        <div class="controls">
            <textarea class="span3" name="listingCoBrokeNotes" placeholder="Notes are seen by Realt Agents only" data-bind="
                      value:listing.cobroke,
                      valueUpdate:'afterkeydown',
                      expand:true"></textarea>
            <span class="help-block" data-bind="validationMessage: listing.cobroke"></span>
        </div>
    </div>
</script>

            <h3 data-bind="text:name() && name() || 'Upload files for listing'"></h3>

</div>

<script type="text/html" id="editAlbumT">
    <div id="editAlbum" data-bind="with:uploadAlbum">
        <section class="RTAWindowContainer">
            <section id="mediaLibrary" class="RTAWindowContent noSidebar">
                <div class="contentArea introBox relative">
                    <form class="form-horizontal">
                        <!--ko template : {name:'albumPopupNav', afterRender:$parent.initUploader}--><!--/ko-->
                        <!--ko ifnot:isDefaultAlbum-->
                        <div class="row-fluid">
                            <div class="span6">
                                <div class="control-group">
                                    <label for="albumname" class="control-label" style="width:90px">Album Name: </label>
                                    <div class="controls" style="margin-left:5px">
                                        <label class="muted inplaceLabel" data-bind="visible:!isEditingName(),click:editName, hoverClass:'text-success', text:name()||'Click to Change'"></label>
                                        <!--ko if:isEditingName-->
                                        <input type="text" autocomplete="off" id="name" data-bind="value:name, valueUpdate: 'afterkeydown', disable:isDefaultAlbum, hasfocus:isEditingName" placeholder="Enter an Album name" style="width:230px">
                                        <!--/ko-->
                                        <span class="help-block"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="span6">
                                <div class="control-group">
                                    <label for="Descriptions" class="control-label" style="width:80px">Description: </label>
                                    <div class="controls" style="margin-left:5px">
                                        <label class="muted inplaceLabel" data-bind="visible:!isEditingExcerpt(),click:editExcerpt, hoverClass:'text-success', text:excerpt()||'Click to Change'"></label>
                                        <!--ko if:isEditingExcerpt-->
                                        <input type="text" autocomplete="off" data-bind="value:excerpt, valueUpdate: 'afterkeydown', disable:isDefaultAlbum, hasfocus:isEditingExcerpt" id="excerpt" placeholder="Enter a description" style="width:230px">
                                        <!--/ko-->
                                        <span class="help-block"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--/ko-->
                    </form>
                </div>
                <!--ko if:showAddFiles-->
                <hr/>
                <ul class="thumbnails" data-bind="foreach:attachments">
                    <li class="span11">
                        <div class="thumbnail">
                            <div class="media">
                                <div class="pull-left" style="text-align: center">
                                    <img alt="Uploaded File" onLoad="$(this).fadeTo('slow', 1)" class="media-object img-rounded" src="/images/nothumb110.png" width="110" height="110" data-bind="attr:{src:getThumbnail}">
                                </div>
                                <div class="media-body">
                                    <!--ko if:isUploading-->
                                    <label class="muted" data-bind="text:uploadingText"></label>
                                    <div class="progress progress-striped active" style="height:15px;border-radius: 2px">
                                        <div class="bar" data-bind="style:{width:percent() + '%'}"></div>
                                    </div>
                                    <!--/ko-->
                                    <!--ko ifnot:isUploading-->
                                    <button type="button" class="close" data-bind="click:$root.deleteFile">&times;</button>
                                    <label style="width:100%">
                                        <span data-bind="text:name"></span>
                                    </label>
                                    <!--ko if:editing-->
                                    <input type="text" data-bind="value:message, hasfocus:editing" placeholder="Describe this item" style="padding:2px" />
                                    <!--/ko-->
                                    <label class="muted inplaceLabel" data-bind="visible:!editing(),click:edit, hoverClass:'text-success', text:message()||'Add Description'"></label>
                                    <!--/ko-->
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
                <!--/ko-->
            </section>
        </section>
    </div>
</script>
<script type="text/html" id="postStatusT">
    <div class="alert alert-success">
        <h5 style="margin:0"><i class="icon-ok"></i> Success! <small class="text-success"> Your listing was successfully posted.</small></h5>
    </div>
    <p class="muted"><i class="icon-info-sign"></i> You can change your cover picture by clicking on the small thumbnails on the right.</p>
    <div class="outerBox" data-bind="with:serverVals">
        <article class="contentArea widgetContentBG relative media listing">
            <div class="pull-left">
                <a href="" class="thumbnail" data-bind="html:getThumbnail.call($data)"></a>
                <div class="mediaThumbLinks">
                    <span class="thumbInfo"><a href="#" class="text-center" style="display: block">View details</a>
                    </span>
                </div>
            </div> <!-- listings thumbnail -->
            <div class="contentBottom media-body media-details">
                <h3 class="media-heading"><a href="#" data-bind="text:page.name, attr:{href:page.uri}"></a></h3>
                <span class="price relative">
                    <span class="listingType" data-bind="html:'FOR<br>' + listing.type()"></span>
                    <span data-bind="text:'$' + RTC.ThousandSep.call(null, listing.price())"></span>
                </span>
                <dl class="dl-horizontal">
                    <dt><i class="info16 sqft"></i></dt><dd data-bind="text:RTC.ThousandSep.call(null, listing.built_size()) + ' sqft'"></dd>
                    <dt><i class="info16 bathrooms"></i></dt><dd data-bind="text:RTC.ThousandSep.call(null, listing.baths()) + ' bathrooms'">3 toilets</dd>
                    <dt><i class="info16 bedrooms"></i></dt><dd data-bind="text:listing.rooms() + ' bedrooms'"></dd>
                </dl>
                <p data-bind="html:excerpt"></p>
            </div> <!-- listings content -->
        </article>
    </div>
</script>
<section class="RTAWindow clearfix" id="listingCreationWizard" style="height:99%;margin:0 auto;">
    <header class="titleBar">
        <div class="contentArea titleBarBG">
            <button type="button" class="close" aria-hidden="true" data-bind="click : hide">&times;</button>
            <h6>Listing Wizard</h6>
        </div>
    </header>
    <nav class="windowMenuBar">
        <ul class="nav nav-pills windowMenu" style="width: 99%">
            <li data-bind="hoverClass:'hovering'">
                <button class="windowMenuItem" data-bind="enable:canGoBack, click:goBack, css:{disabled:!canGoBack()}"><i class="icon-circle-arrow-left icon-3x"></i>Back</button>
            </li>
            <li data-bind="hoverClass:'hovering'">
                <button class="windowMenuItem" data-bind="css:{disabled: currentIndex() <= 0}, enable:currentIndex() > 0, click:resetSteps"><i class="icon-undo  icon-3x"></i>Reset</button>
            </li>
            <li data-bind="hoverClass:'hovering'">
                <button class="windowMenuItem" data-bind="enable:canGoNext, click:goNext, css:{disabled:!canGoNext()}"><i class="icon-circle-arrow-right icon-3x"></i>Next</button>
            </li>
            <li data-bind="hoverClass:'hovering'">
                <button class="windowMenuItem" data-bind="css:{disabled: !currentIndex() < 3}, enable:currentIndex() >= 3, click:publish"><i class="icon-ok-sign icon-3x"></i>Publish</button>
            </li>
            <li data-bind="hoverClass:'hovering'" class="pull-right">
                <button class="windowMenuItem" data-bind="click : hide"><i class="icon-ban-circle icon-3x"></i>Cancel</button>
            </li>
        </ul>
    </nav>
    <div class="row-fluid">
        <section class="RTAWindowContainer">
            <div class="span9 clearfix" style="height:100%">
                <section class="RTAWindowContent noSidebar clearfix" style="position:relative;bottom:0;height:100%;border-right:1px solid #DDDDDD">
                    <ul class="nav nav-tabs visible-desktop" id="stepsTabs" data-bind="visible:!(currentStep().id()>3)">
                        <!--ko ifnot:editing-->
                        <li data-bind="css:{active:currentStep().id() === steps()[0].id()}">
                            <a href="#" class="muted" data-bind="click:goToStep.bind($data,steps()[0])">
                                <span data-bind="text:steps()[0].name"></span>
                            </a>
                        </li>
                        <!--/ko-->
                        <li data-bind="css:{active:currentStep().id() === steps()[1].id()}">
                            <a href="#" class="muted" data-bind="click:goToStep.bind($data,steps()[1])">
                                <span data-bind="text:steps()[1].name"></span>
                            </a>
                        </li>
                        <li data-bind="css:{active:currentStep().id() === steps()[2].id()}">
                            <a href="#" class="muted" data-bind="click:goToStep.bind($data,steps()[2])">
                                <span data-bind="text:steps()[2].name"></span>
                            </a>
                        </li>
                    </ul>
                    <!--ko if: currentIndex() === 3-->
                    <header class="alert alert-info clearfix" style="position: absolute; right:1px; padding: 5px; z-index: 1; top:1px; left: 1px;">
                        <div class="row-fluid">
                            <div class="span6">
                                <label style="width:100%;font-size:1.2em;color: #222;">
                                    <span data-bind="html:albumNavText"></span>&nbsp;&nbsp;<small style="display:block;" data-bind="html:addedMediaCaption"></small>
                                </label>
                            </div>
                            <div class="span6">
                                <!--ko ifnot:mediaLib().selectedAlbum-->
                                <div class="btn-group pull-right"><a class="btn btn-mini" data-bind="html:uploadOptionText, click:prepareForUpload" href="#"></a></div>
                                <!--/ko-->
                                <!--ko if:mediaLib().selectedAlbum-->
