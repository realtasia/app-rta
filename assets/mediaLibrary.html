<section class="contentArea centerContent clearfix" id="libraryMobile" data-bind="css:{'container-fluid': RTApp.isSmallerThanTablet}">
    <div data-bind="slideTemplate:{name:'page', data:currentPage, if: currentPage}"></div>
    <a href="#" data-bind="visible:!currentPage(), click:function(){return currentIndex(1);}">Show Messages</a>
</section> <!--library main page-->

<script type="text/html" id="page">
<div class="navbar navbar-subcontrol">
    <div class="navbar-inner">
        <ul class="nav pull-left" data-bind="with: backLink">
            <li>
                <a href="#" data-bind="click: $data.action, title:$data.title, position:'bottom', href: uri">
                    <i data-bind="attr:{ 'class': $data.icon}"></i>
                </a>
            </li>
            <li class="divider-vertical"></li>
        </ul>
        <h4 data-bind="text:$data.name"></h4>
        <ul class="nav pull-right" data-bind="foreach:rightLinks">
            <li class="divider-vertical"></li>
            <li>
                <a href="#" data-bind="click: $data.action, title:$data.title, position:'bottom', href: $data.uri">
                    <i data-bind="attr:{ 'class': $data.icon}"></i>
                </a>
            </li>
        </ul>
    </div>
</div>
<ul class="breadcrumb" style="border-radius:0;margin:-20px 0 20px 0;font-size:90%" data-bind="template:{name:'crumbs', foreach:$parent.history}"></ul>
<div data-bind="template:content" style="border-top:1px solid #eee;padding:10px"></div>
</script> <!--page-->

<script type="text/html" id="albumsList">
<ul class="media-list" id="albumView" data-bind="foreach:$data">
    <li class="media">
        <a class="clearfix" href="#" data-bind="click:seeAlbum, href: hashURL">
            <div class="pull-left">
                <span data-bind="html:getThumbnail(90)"></span>
            </div>
            <div class="media-body">
                <p><span data-bind="text:name"></span>&nbsp;(<span data-bind="text:counts.attachments"></span>)<small class="muted">&nbsp;&middot;&nbsp;<time data-bind="timeago:modified"></time></small></p>
                <small style="color:#333;" data-bind="text: caption"></small>
            </div>
        </a>
    </li>
</ul>
</script> <!--album list-->

<script type="text/html" id="pictureList">
<div>
    <!--ko foreach:$data-->
    <a class="thumbnail grid" data-bind="click:seeAttachment, href: hashURL">
        <span data-bind="html:getAttachmentThumb(150)"></span>
    </a>
    <!--/ko-->
    <div class="thumbnail grid" style="cursor: pointer;">
        <a data-bind="visible: $parent.hasNextPage" href="#" id="loadAttachments" style="width:150px;height:85px;text-align: center;font-size: 2em;display:block;margin-top:65px">Load More</a>
    </div>
</div>
</script> <!--picture list-->

<script type="text/html" id="editForm">
<div style="margin:0 auto;min-height:32px;">
    <div class="alert" style="margin-bottom:0;display:none;padding:5px 10px;">
        <span style="font-variant:small-caps;font-size:90%">Saved &middot;
            a href="#"><i class="icon-undo"></i> Undo Changes</a>
        </span>
    </div>
</div>
<form class="RTForm">
    <label>Description</label>
    <textarea type="text" class="input-large" data-bind="value: $data.name, valueUpdate: 'afterkeydown', expand:35" />
    <input type="hidden" name="state" data-bind="value:RTApp.st" />
</form>
</script> <!--edit form-->

<script type="text/html" id="pictureView">
<div id="singleAttachment" class="carousel slide">
    <div class="carousel-inner">
        <div class="item active">
            <div class="relative">
                <small class="shadowedText" style="position:absolute;left:5px;top:5px;" data-bind="text:$data.pagination"></small>
                <div class="centralize" data-bind="getHtml:$data.getFullPreview.bind($data)"></div>
            </div>
            <div class="postTitle">
                <p><span style="margin-right:5px" data-bind="text:$data.caption"></span>&middot;&nbsp;<small class="muted"><time data-bind="timeago:created"></time></small></p> </div>
            <div class="btn-toolbar">
                <label class="muted inplaceLabel" data-bind="visible:!editing(),click:startEdit, hoverClass:'showIcon'"><span data-bind="text:'Click to edit description'"></span><span class="pull-right"><i class="icon-edit" style="display:none;"></i></span></label>
                <!--ko if: editing-->
                <input type="text" autocomplete="off" id="editItemName" data-bind="value:$data.name, valueUpdate: 'afterkeydown', hasfocus:editing" placeholder="Enter a description.">
                <!--/ko-->
            </div>
            <!--ko template:'postActionLinks'--><!--/ko-->
            <!--ko template:{name:'postComments',if:showCommentBox() && !isTestimonial()}--><!--/ko-->
        </div>
    </div>
    <!-- Carousel nav -->
    <a class="carousel-control left" href="#singleAttachment" data-bind="click:$parent.previous">&lsaquo;</a>
    <a class="carousel-control right" href="#singleAttachment" data-bind="click:$parent.next">&rsaquo;</a>
</div>
</script> <!--picture view-->

<script type="text/html" id="crumbs">
<li data-bind="css:{active:($index() + 1) === $root.history().length}">
    <!--ko if: $index() + 1 === $root.history().length-->
    <span data-bind="text:name"></span>
    <!--/ko-->
    <!--ko ifnot: $index() + 1 === $root.history().length-->
    <a href="#" data-bind="text:name, href: hashURL, click:backLink.action || function(){return true;}"></a>
    <span class="divider" style="padding:0">/</span>
    <!--/ko-->
</li>
</script> <!--crumbs-->

<script type="text/html" id="albumPopupNav">
<div class="row-fluid" style="margin-bottom:10px">
    <div class="span5">
        <h3 data-bind="html:name() && name() || 'Create New Album'"></h3>
        <span class="muted" data-bind="html:excerpt"></span>
    </div>
    <div class="span7">
        <div class="btn-toolbar pull-right">
            <!--ko ifnot:isDefaultAlbum-->
            <div class="btn-group">
                <button class="btn btn-small btn-rta" id="browseButton" data-bind="click:checkAlbum">
                    <i class="icon-upload"></i> Add Files
                </button>
            </div>
            <div class="btn-group" data-toggle="buttons-radio" style="z-index:10">
                <button type="button"  class="btn btn-small" data-bind="title:'Make album Public', placement:'bottom', css:{active:privacy.is() === 'PUBLIC'}, click:setPublic">
                    <i class="icon-eye-open"></i></button>
                <button type="button"  class="btn btn-small" data-bind="title:'Make album Private', placement:'bottom', css:{active:privacy.is() === 'PRIVATE'}, click:setPrivate">
                    <i class="icon-eye-close"></i></button>
            </div>
            <div class="btn-group">
                <button class="btn btn-small" data-bind="click:$parent.deleteAlbum.bind($parent)"><i class="icon-remove-sign"></i> Delete Album</button>
            </div>
            <!--/ko-->
            <div class="btn-group">
                <button class="btn btn-small btn-info" data-bind="click:saveAlbum, enable:isSavable"><i class="icon-ok-sign"></i> <span data-bind="text:autoSaveMessage() || 'Save'"></span></button>
            </div>
        </div>
    </div>
</div>
</script> <!--album Popup Nav-->

<script type="text/html" id="uploadedThumbs">
<li class="span6">
    <div class="thumbnail">
        <div class="media">
            <div class="pull-left" style="text-align: center">
                <img alt="Uploaded File" onLoad="$(this).fadeTo('slow', 1)" class="media-object img-rounded" src="/images/nothumb110.png" width="110" height="110" data-bind="attr:{src:getThumbnail}">
            </div>
            <div class="media-body">
                <!--ko if:isUploading-->
                <label class="muted" data-bind="text:uploadingText"></label>
                <div class="progress progress-striped active" style="height:15px;border-radius: 2px">
                    <div class="bar" data-bind="style:{width:percent() + '%'}"></div>
                </div>
                <!--/ko-->
                <!--ko ifnot:isUploading-->
                    <button type="button" class="close" data-bind="click:$parents[1].deleteFile"><i class="icon-remove"></i></button>
                    <label><span data-bind="text:name"></span></label>
                    <!--ko if:editing-->
                        <input type="text" data-bind="value:message, hasfocus:editing" placeholder="Describe this item" style="padding:2px" />
                    <!--/ko-->
                    <label class="muted inplaceLabel" data-bind="visible:!editing(),click:edit, hoverClass:'text-success', text:message()||'Add Description'"></label>
                <!--/ko-->
            </div>
        </div>
    </div>
</li>
</script> <!--uploaded thumbs-->

<div id="editAlbum" data-bind="with:editingAlbum">
    <section class="RTAWindow" data-bind="visible:$data" style="display:none;">
        <header class="titleBar">
            <div class="contentArea titleBarBG">
                <button type="button" class="close" aria-hidden="true" data-bind="click:$parent.stopEditingAlbum"><i class="icon-remove"></i></button>
                <h4><i class="icon-upload-alt"></i> Upload</h4>
            </div>
        </header>
        <section class="RTAWindowContainer">
            <section id="uploadArea" class="RTAWindowContent noSidebar">
                <div class="contentArea introBox relative">
                    <form class="form-horizontal">
                        <!--ko template : 'albumPopupNav'--><!--/ko-->
                        <div class="row-fluid" data-bind="ifnot:isDefaultAlbum">
                            <div class="span6">
                                <div class="btn-toolbar">
                                    <label class="muted inplaceLabel" data-bind="visible:!isEditingName(),click:editName, hoverClass:'showIcon'"><span data-bind="html:name()||'Click to add an album name'"></span><span class="pull-right"><i class="icon-edit" style="display:none;"></i></span></label>
                                    <!--ko if:isEditingName-->
                                    <input type="text" autocomplete="off" id="editAlbumName" data-bind="value:name, valueUpdate: 'afterkeydown', disable:isDefaultAlbum, hasfocus:isEditingName" placeholder="Enter an Album name">
                                    <!--/ko-->
                                </div>
                            </div>
                            <div class="span6">
                                <div class="btn-toolbar">
                                    <label class="muted inplaceLabel" data-bind="visible:!isEditingExcerpt(),click:editExcerpt, hoverClass:'showIcon'"><span data-bind="html:excerpt()||'Click to add an album description'"></span><span class="pull-right"><i class="icon-edit" style="display:none;"></i></span></label>
                                    <!--ko if:isEditingExcerpt-->
                                    <input type="text" autocomplete="off" data-bind="value:excerpt, valueUpdate: 'afterkeydown', disable:isDefaultAlbum, hasfocus:isEditingExcerpt" id="editAlbumExcerpt" placeholder="Enter a description">
                                    <!--/ko-->
                                    <span class="help-block"></span>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <!--ko if:showAddFiles-->
                <hr/><ul class="thumbnails" data-bind="template:{name:'uploadedThumbs', foreach:attachments}"></ul>
                <!--/ko-->
            </section>
        </section>
    </section>
</div>
