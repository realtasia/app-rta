<section class="RTAWindow" id="qrcodeContent" style="min-width:550px">
    <header class="titleBar">
        <div class="contentArea titleBarBG">
            <button type="button" class="close" aria-hidden="true" onclick="$.colorbox.close()"><i class="icon-remove"></i></button>
            <h4><i class="icon-info-sign"></i> Scan contact details</h4>
        </div>
    </header>
    <section class="RTAWindowContainer">
        <section class="RTAWindowContent noSidebar">
            <div class="contentArea clearfix">
                <div class="media">
                    <div class="pull-left">
                        <img class="img-polaroid" data-bind="attr:{src:RTApp.cp().uri() + '/qrcode'}" width="150" height="150">
                    </div>
                    <div class="media-body">
                        <h5 class="noMargTopBtm">To scan, you will need a barcode reader.</h5>
                        <p><small class="muted">We have tested successfully with these mobile apps:</small></p>

                        <ul>
                            <li><a data-bind="title:'This opens a new tab linking to Qrafter in iTunes store'" target="_blank" href="/external?uri=https://itunes.apple.com/us/app/qrafter-qr-code-barcode-reader/id416098700?mt=8">Qrafter</a> <label class="label inline"><small>iPhone/iPad</small></label></li>
                            <li><a data-bind="title:'This opens a new tab linking to Barcode Scanner in Google Play'" target="_blank" href="/external?uri=https://play.google.com/store/apps/details?id=com.google.zxing.client.android&hl=en">Barcode Scanner</a> <label class="label inline"><small>Android</small></label></li>
                        </ul>
                    </div>
                </div>
                <p><small class="text-warning" style="position:absolute;bottom:0"><i class="icon-warning-sign"></i> We are not affiliated with the above apps. Use with discretion.</small></p>
            </div>
        </section>
    </section>
</section>
