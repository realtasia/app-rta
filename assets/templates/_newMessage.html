<section class="RTAWindow" id="newMessageContent" style="min-width:550px">
    <header class="titleBar">
        <div class="contentArea titleBarBG">
            <button type="button" class="close" aria-hidden="true" onclick="$.colorbox.close()">×</button>
            <h4><i class="icon-info-sign"></i> New Message</h4>
        </div>
    </header>
    <section class="RTAWindowContainer">
        <section class="RTAWindowContent noSidebar">
            <div class="contentArea clearfix media-list">
                <div class="media">
                    <div class="pull-left"><label style="padding:5px;">To:</label></div>
                    <div class="media-body">
                        <span data-bind="visible:!receipient(), flash:!receipient(), reverse:receipient"><input id="sR" type="text" placeholder="Type a name" data-bind="value:s"></span>
                        <span data-bind="visible:receipient, flash:receipient, reverse:receipient" style="display:none"><a class="btn btn-link">Chosen User to Send</a></span>
                    </div>
                </div>
                <p><small class="text-warning" style="position:absolute;bottom:0"><i class="icon-warning-sign"></i> We are not affiliated with the above apps. Use with discretion.</small></p>
            </div>
        </section>
    </section>
</section>
