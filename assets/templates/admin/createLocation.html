<section class="RTAWindow clearfix" id="locationForm" style="margin:0 auto;height:auto">
    <header class="titleBar">
        <div class="contentArea titleBarBG">
            <button type="button" class="close" aria-hidden="true" data-bind="click : function(){return $.colorbox.close()}">&times;</button>
            <h4><i class="icon-compass"></i> Location Form</h4>
        </div>
    </header>
    <section class="RTAWindowContainer">
        <section class="RTAWindowContent noSidebar">
            <div title="Create Location" class="contentArea">
                <form>
                    <fieldset>
                        <legend><small>Location Details</small></legend>
                        <p class="text-error" data-bind="visible: $root.isError">
                            <strong data-bind="text: $root.ajaxMessage"> </strong>
                        </p>
                        <label class="control-label">Name</label>
                        <input type="text" data-bind="value:$data.name" name="name" placeholder="Name">
                        <label class="control-label">Sub Type</label>
                        <select data-bind="options: static.subtypes, value: subtype, optionsCaption: 'Choose a subtype'" name="subtype"></select>
                        <label class="control-label">Property Type</label>
                        <select data-bind="enable:propertyTypes, options: propertyTypes, value:property_type, optionsCaption: 'Choose a propertytype'" name="proptype"></select>
                    </fieldset>
                    <br>
                    <fieldset>
                        <legend style="margin-bottom:5px;"><small>Modify Estate</small></legend>
                        <!--ko ifnot: $data.changeEstate-->
                        <h5>
                            <span data-bind="text: $data.computedEstate"></span>
                            <small><a href="#"  style="padding-left:10px" data-bind="reverse: $data.changeEstate"><i class="icon-edit-sign"></i> Change</a></small>
                        </h5>
                        <!--/ko-->
                        <div data-bind="if: $data.changeEstate">
                            <small class="text-warning">
                                <i class="icon-warning-sign"></i> Changing Estate will affect all 'child' locations within itself.
                                <a href="#" data-bind="reverse: $data.changeEstate"><i class="icon-ban-circle"></i>  Cancel</a>
                            </small>
                            <input type="text" data-bind="value: $data.computedEstate, valueUpdate:'afterkeydown'" name="estate" placeholder="Estate">
                        </div>
                    </fieldset>
                    <input type="hidden" data-bind="value:type" name="type" placeholder="Type">
                    <!--ko if: $data.create-->
                    <div class="btn-toolbar">
                        <div class="btn-group">
                            <button type="submit" data-bind="click:$data.create" class="btn">
                                <span data-bind="text:$data.saveLabel"></span>
                            </button>
                        </div>
                        <!--ko if: $data.saveTime-->
                        <div class="btn-group">
                            <button class="alert" style="margin-bottom:0;padding:4px;cursor:default" disabled="disabled"><span>saved <span data-bind="timeago:$data.saveTime"></span></span></button>
                        </div>
                        <!--/ko-->
                    </div>
                    <!--/ko-->
                </form>
            </div>
        </section>
    </section>
</section>
